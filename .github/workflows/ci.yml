name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -v
      - name: Run the demo build
        run: python mask_build.py --demo
      - uses: actions/upload-artifact@v6
        with:
          name: mask-output
          path: |
            mask_out.gds
            build_record.json
